<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landfall — Where Brands Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0c0b09;
    --cream: #f0ebe0;
    --sand: #c9b99a;
    --rust: #b85c2a;
    --rust-dim: rgba(184, 92, 42, 0.15);
    --olive: #3d4a35;
    --fog: #e4dcca;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Syne', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    position: relative;
  }

  /* ── BACKGROUND ── */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  /* Noise texture overlay */
  .bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
  }

  /* Radial glow from bottom */
  .bg-glow {
    position: absolute;
    bottom: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 80vw;
    height: 60vh;
    background: radial-gradient(ellipse at center bottom, rgba(184,92,42,0.14) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Terrain silhouette */
  .terrain {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28vh;
    opacity: 0;
    animation: terrainIn 2.5s ease forwards 1.8s;
  }

  .terrain svg {
    width: 100%;
    height: 100%;
    preserveAspectRatio: none;
  }

  @keyframes terrainIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Horizon line */
  .horizon-line {
    position: absolute;
    bottom: 27vh;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--rust) 30%, var(--sand) 50%, var(--rust) 70%, transparent 100%);
    opacity: 0;
    animation: horizonIn 2s ease forwards 2.2s;
  }

  @keyframes horizonIn {
    to { opacity: 0.3; }
  }

  /* Stars */
  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 1px;
    height: 1px;
    background: var(--sand);
    border-radius: 50%;
    opacity: 0;
    animation: starFade var(--dur, 3s) ease-in-out var(--delay, 0s) infinite alternate;
  }

  @keyframes starFade {
    from { opacity: 0; }
    to   { opacity: var(--max-opacity, 0.4); }
  }

  /* ── CONTENT ── */
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--rust);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.3s;
    margin-bottom: 1.8rem;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: clamp(5.5rem, 18vw, 13rem);
    line-height: 0.88;
    letter-spacing: -0.03em;
    color: var(--cream);
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 0.6s;
    position: relative;
  }

  .wordmark .accent {
    color: var(--rust);
    font-style: italic;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    color: var(--sand);
    letter-spacing: 0.08em;
    margin-top: 1.4rem;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 1.1s;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--rust);
    margin: 2.2rem auto;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.4s;
  }

  .soon-text {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--sand);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.6s;
    margin-bottom: 2.4rem;
  }

  /* Email form */
  .form-wrap {
    display: flex;
    gap: 0;
    max-width: 380px;
    width: 100%;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 2s;
  }

  .email-input {
    flex: 1;
    background: rgba(240, 235, 224, 0.07);
    border: 1px solid rgba(201, 185, 154, 0.2);
    border-right: none;
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    padding: 0.8rem 1.2rem;
    outline: none;
    box-shadow: none;
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.3s;
  }

  .email-input::placeholder {
    color: rgba(201, 185, 154, 0.35);
  }

  .email-input:focus {
    border-color: rgba(184, 92, 42, 0.5);
  }

  .email-btn {
    background: var(--rust);
    border: 1px solid var(--rust);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.8rem 1.4rem;
    cursor: pointer;
    transition: background 0.3s;
    white-space: nowrap;
  }

  .email-btn:hover {
    background: #a04e22;
  }

  .success-msg {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--rust);
    display: none;
    margin-top: 0.5rem;
  }

  /* Social link */
  .social {
    margin-top: 2.8rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 2.3s;
  }

  .social a {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: rgba(201,185,154,0.45);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .social a:hover {
    color: var(--rust);
  }

  /* ── FOOTER ── */
  .footer {
    position: fixed;
    bottom: 1.8rem;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 2.5rem;
    z-index: 2;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 2.6s;
  }

  .footer-left {
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: rgba(201,185,154,0.3);
    text-transform: uppercase;
    line-height: 1.6;
  }

  .footer-right {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: rgba(201,185,154,0.3);
    letter-spacing: 0.05em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .form-wrap { max-width: 90vw; }
    .footer { display: none; }
    .wordmark { font-size: clamp(4.5rem, 20vw, 8rem); }
    .eyebrow {
      font-size: 0.48rem;
      letter-spacing: 0.15em;
      white-space: nowrap;
    }
    .terrain { height: 32vh; }
    .horizon-line { bottom: 31vh; }
    html { height: -webkit-fill-available; }
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg">
  <div class="bg-glow"></div>
  <div class="stars" id="stars"></div>

  <!-- Terrain SVG -->
  <div class="terrain">
    <svg viewBox="0 0 1440 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0,200 L0,120 C80,100 160,140 240,115 C320,90 400,70 480,88 C560,106 640,65 720,50 C800,35 880,72 960,85 C1040,98 1120,60 1200,78 C1280,96 1360,110 1440,95 L1440,200 Z"
        fill="rgba(61,74,53,0.35)" />
      <path d="M0,200 L0,150 C100,130 200,160 300,145 C400,130 500,105 600,118 C700,131 800,95 900,108 C1000,121 1100,98 1200,112 C1300,126 1380,140 1440,130 L1440,200 Z"
        fill="rgba(61,74,53,0.2)" />
    </svg>
  </div>

  <div class="horizon-line"></div>
</div>

<!-- Main content -->
<div class="content">
  <div class="eyebrow">Branding · Identidad · Desarrollo de Producto</div>

  <h1 class="wordmark">Land<span class="accent">fall</span></h1>

  <p class="tagline">Where brands land.</p>

  <div class="divider"></div>

  <p class="soon-text">Próximamente</p>

  <form class="form-wrap" action="https://thelandfall.us9.list-manage.com/subscribe/post?u=55fa56ba4e9e64b52719636ae&amp;id=ee27014f19&amp;f_id=00ca59e1f0" method="post" target="_blank" id="mc-form" novalidate>
    <input class="email-input" type="email" name="EMAIL" id="emailInput" placeholder="tu@correo.com" required />
    <div style="position:absolute;left:-5000px;" aria-hidden="true">
      <input type="text" name="b_55fa56ba4e9e64b52719636ae_ee27014f19" tabindex="-1" value="">
    </div>
    <button class="email-btn" type="submit">Avisar</button>
  </form>
  <p class="success-msg" id="successMsg">✓ &nbsp;Te avisamos pronto.</p>

  <div class="social">
    <a href="https://instagram.com/landfallstudio" target="_blank">@landfallstudio</a>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-left">
    Culiacán · Sinaloa · México<br>
    thelandfall.com
  </div>
  <div class="footer-right">Si estás construyendo algo que vale la pena — hablemos.</div>
</div>

<script>
  // Generate stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 65 + '%';
    star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    star.style.setProperty('--delay', (Math.random() * 5) + 's');
    star.style.setProperty('--max-opacity', (0.1 + Math.random() * 0.45).toFixed(2));
    starsEl.appendChild(star);
  }

  // Form submit
  document.getElementById('mc-form').addEventListener('submit', function(e) {
    const input = document.getElementById('emailInput');
    if (!input.value || !input.value.includes('@')) {
      e.preventDefault();
      input.style.borderColor = 'rgba(184,92,42,0.4)';
      setTimeout(() => { input.style.borderColor = 'rgba(201, 185, 154, 0.2)'; }, 1500);
      return;
    }
    document.getElementById('mc-form').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  });
</script>

</body>
</html>
